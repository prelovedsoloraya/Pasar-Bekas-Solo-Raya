<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasar Bekas Solo 🏮</title>
  <meta name="description" content="Pasar barang bekas lokal area Surakarta — barang bagus, harga jujur." />

  <script>
    const CONFIG = {
      SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTa44CngjNq1XaYp9bhTfUfq-Ntgcs7WI82pT67qxTJqb5gcRbSPMbO41LGt29qoc8amyYX6Yu5Qq8/pub?gid=0&single=true&output=csv",
      CARDS_PER_PAGE: 3,
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:      #534AB7;
      --purple-dark: #3C3489;
      --purple-pale: #EEEDFE;
      --purple-mid:  #AFA9EC;
      --bg:          #FAFAF8;
      --bg2:         #F3F2EF;
      --border:      #E4E2DC;
      --border2:     #CECCBF;
      --text1:       #1A1916;
      --text2:       #5F5E5A;
      --text3:       #9A9891;
      --green-bg:    #EAF3DE;
      --green-fg:    #3B6D11;
      --amber-bg:    #FAEEDA;
      --amber-fg:    #854F0B;
      --gray-bg:     #F1EFE8;
      --gray-fg:     #5F5E5A;
      --blue-bg:     #E6F1FB;
      --blue-fg:     #0C447C;
      --red-bg:      #FCEBEB;
      --red-fg:      #791F1F;
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   16px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text1); min-height: 100dvh; }
    a { color: inherit; text-decoration: none; }

    .page { max-width: 960px; margin: 0 auto; padding: 0 1.5rem 3rem; }

    .topbar {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 2rem 0 1rem; border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem; gap: 1rem; flex-wrap: wrap;
    }
    .topbar-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 4vw, 32px); font-weight: 900;
      line-height: 1.1; letter-spacing: -0.02em;
    }
    .topbar-left .tagline { font-size: 13px; color: var(--text2); margin-top: 4px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .badge-lokasi {
      font-size: 11px; font-weight: 600; padding: 5px 12px;
      border-radius: 999px; background: var(--purple-pale);
      color: var(--purple-dark); border: 1px solid var(--purple-mid);
      letter-spacing: 0.02em;
    }
    .btn-jual {
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      padding: 7px 16px; border-radius: 999px; background: var(--purple);
      color: var(--purple-pale); border: none; cursor: pointer; transition: background 0.15s;
    }
    .btn-jual:hover { background: var(--purple-dark); }

    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 15px; color: var(--text3); pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--border);
      border-radius: var(--radius-md); background: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--text1); outline: none; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--purple-mid); box-shadow: 0 0 0 3px rgba(83,74,183,0.08); }
    .search-input::placeholder { color: var(--text3); }

    .filters {
      display: flex; gap: 8px; margin-bottom: 1.5rem;
      overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      font-size: 12px; font-weight: 500; padding: 6px 15px; border-radius: 999px;
      border: 1px solid var(--border); background: #fff; color: var(--text2);
      cursor: pointer; white-space: nowrap; transition: all 0.15s; font-family: 'DM Sans', sans-serif;
    }
    .filter-btn.active { background: var(--purple); color: var(--purple-pale); border-color: var(--purple); }
    .filter-btn:hover:not(.active) { background: var(--bg2); color: var(--text1); }

    .stats-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; font-size: 13px; color: var(--text2);
    }
    .stats-count { font-weight: 500; color: var(--text1); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

    .card {
      border: 1px solid var(--border); border-radius: var(--radius-lg); background: #fff;
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      animation: fadeUp 0.35s ease both;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-color: var(--border2); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card:nth-child(1){animation-delay:.00s}.card:nth-child(2){animation-delay:.04s}
    .card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}
    .card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.20s}
    .card:nth-child(n+7){animation-delay:.24s}

    .card-img {
      width: 100%; height: 155px; object-fit: cover; background: var(--bg2);
      display: flex; align-items: center; justify-content: center;
      font-size: 54px; flex-shrink: 0; user-select: none;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 10px 13px 13px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .card-cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); }
    .card-name { font-size: 14px; font-weight: 500; color: var(--text1); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-price { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--purple); margin-top: 5px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .card-loc { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-loc svg { flex-shrink: 0; }

    .card-cond { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
    .cond-baru          { background: var(--green-bg);  color: var(--green-fg); }
    .cond-like-new      { background: var(--purple-pale); color: var(--purple-dark); }
    .cond-bekas-mulus   { background: var(--blue-bg);   color: var(--blue-fg); }
    .cond-bekas-normal  { background: var(--amber-bg);  color: var(--amber-fg); }
    .cond-bekas-rusak   { background: var(--red-bg);    color: var(--red-fg); }
    .cond-default       { background: var(--gray-bg);   color: var(--gray-fg); }

    .state-msg { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text2); font-size: 15px; }
    .state-msg .icon { font-size: 40px; display: block; margin-bottom: 12px; }
    .state-msg .hint { font-size: 13px; color: var(--text3); margin-top: 6px; }

    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: #fff; border-radius: var(--radius-lg); max-width: 420px; width: 100%; overflow: hidden; transform: scale(0.94); transition: transform 0.2s; box-shadow: 0 24px 60px rgba(0,0,0,0.18); }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-img { width: 100%; height: 220px; object-fit: cover; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 72px; }
    .modal-img img { width: 100%; height: 100%; object-fit: cover; }
    .modal-body { padding: 20px 22px 22px; }
    .modal-cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 6px; }
    .modal-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; line-height: 1.2; }
    .modal-price { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--purple); margin: 10px 0; }
    .modal-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-bottom: 18px; }
    .modal-meta span { display: flex; align-items: center; gap: 4px; background: var(--bg2); padding: 4px 10px; border-radius: 999px; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-btn { flex: 1; padding: 11px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .modal-btn:hover { background: var(--bg2); }
    .modal-btn.primary { background: var(--purple); color: var(--purple-pale); border-color: var(--purple); }
    .modal-btn.primary:hover { background: var(--purple-dark); }

    /* Foto carousel di modal */
    .modal-foto-wrap { position: relative; width: 100%; height: 220px; background: var(--bg2); overflow: hidden; }
    .modal-foto-track { display: flex; height: 100%; transition: transform 0.3s ease; }
    .modal-foto-track img { min-width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; }
    .modal-foto-track .emoji-fb { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 72px; flex-shrink: 0; }
    .modal-foto-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.35); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-foto-prev { left: 8px; }
    .modal-foto-next { right: 8px; }
    .modal-foto-dots { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
    .modal-foto-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); }
    .modal-foto-dots span.active { background: #fff; }

    .footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--text3); }
    .footer a { color: var(--purple); }

    @media (max-width: 600px) {
      .topbar { padding-top: 1.25rem; }
      .topbar-right { gap: 6px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
<div class="page">
  <header class="topbar">
    <div class="topbar-left">
      <h1>🏮 Pasar Bekas Solo</h1>
      <p class="tagline">Barang lokal · Harga jujur · Area Surakarta</p>
    </div>
    <div class="topbar-right">
      <span class="badge-lokasi">📍 Solo &amp; sekitar</span>
      <button class="btn-jual" id="btn-jual">+ Jual Barang</button>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" type="search" placeholder="Cari barang…" autocomplete="off" />
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="semua">Semua</button>
    <button class="filter-btn" data-cat="elektronik">📱 Elektronik</button>
    <button class="filter-btn" data-cat="perabot">🛋️ Perabot</button>
    <button class="filter-btn" data-cat="fashion">👗 Fashion</button>
    <button class="filter-btn" data-cat="hobi">🎸 Hobi</button>
    <button class="filter-btn" data-cat="otomotif">🏍️ Otomotif</button>
    <button class="filter-btn" data-cat="lainnya">📦 Lainnya</button>
  </div>

  <div class="stats-bar">
    <span id="stats-text"></span>
  </div>

  <div class="grid" id="grid">
    <div class="state-msg" id="loading-state">
      <div class="spinner"></div>
      <div>Sedang memuat barang…</div>
    </div>
  </div>

  <footer class="footer">
    <span>🏮 Pasar Bekas Solo — <a href="https://github.com" target="_blank">GitHub Pages</a></span>
    <span>Foto di <a href="https://imgbb.com" target="_blank">ImgBB</a></span>
  </footer>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-foto-wrap" id="modal-foto-wrap"></div>
    <div class="modal-body">
      <div class="modal-cat"   id="modal-cat"></div>
      <div class="modal-name"  id="modal-name"></div>
      <div class="modal-price" id="modal-price"></div>
      <div class="modal-meta"  id="modal-meta"></div>
      <div class="modal-actions">
        <button class="modal-btn" id="modal-close">Tutup</button>
        <button class="modal-btn primary" id="modal-wa">💬 Tanya via WA</button>
      </div>
    </div>
  </div>
</div>

<script>
function formatRupiah(n) {
  return 'Rp ' + Number(n).toLocaleString('id-ID');
}

function condClass(k) {
  const map = {
    'baru':               'cond-baru',
    'like new':           'cond-like-new',
    'bekas mulus':        'cond-bekas-mulus',
    'bekas normal':       'cond-bekas-normal',
    'bekas rusak ringan': 'cond-bekas-rusak',
  };
  return map[(k || '').toLowerCase()] || 'cond-default';
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] || '').replace(/^"|"$/g, '').trim());
    return obj;
  }).filter(r => r.nama);
}

let allItems = [], activeFilter = 'semua', searchQuery = '', selectedItem = null;

function getFotos(item) {
  if (!item.foto) return [];
  return item.foto.split(',').map(s => s.trim()).filter(Boolean);
}

function renderCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.cat = (item.kategori || '').toLowerCase();

  const fotos = getFotos(item);
  const imgWrap = document.createElement('div');
  imgWrap.className = 'card-img';
  if (fotos.length > 0) {
    const img = document.createElement('img');
    img.src = fotos[0];
    img.alt = item.nama;
    img.loading = 'lazy';
    img.onerror = () => { imgWrap.innerHTML = item.emoji || '📦'; };
    imgWrap.appendChild(img);
  } else {
    imgWrap.textContent = item.emoji || '📦';
  }

  const condLabel = item.kondisi || 'Bekas Normal';
  const condCls   = condClass(item.kondisi);

  card.innerHTML = `
    <div class="card-body">
      <span class="card-cat">${item.kategori || 'Lainnya'}</span>
      <p class="card-name">${item.nama}</p>
      <div class="card-price">${formatRupiah(item.harga || 0)}</div>
      <div class="card-footer">
        <span class="card-loc">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          ${item.lokasi || '—'}
        </span>
        <span class="card-cond ${condCls}">${condLabel}</span>
      </div>
    </div>`;

  card.prepend(imgWrap);
  card.addEventListener('click', () => openModal(item));
  return card;
}

function getFiltered() {
  return allItems.filter(item => {
    const catOk    = activeFilter === 'semua' || (item.kategori || '').toLowerCase() === activeFilter;
    const q        = searchQuery.toLowerCase();
    const searchOk = !q || (item.nama || '').toLowerCase().includes(q) ||
                     (item.lokasi || '').toLowerCase().includes(q) ||
                     (item.kategori || '').toLowerCase().includes(q);
    return catOk && searchOk;
  });
}

function renderGrid() {
  const grid     = document.getElementById('grid');
  const filtered = getFiltered();
  grid.innerHTML = '';
  document.getElementById('stats-text').textContent = filtered.length ? filtered.length + ' barang ditemukan' : '';
  if (!filtered.length) {
    const msg = document.createElement('div');
    msg.className = 'state-msg';
    msg.innerHTML = '<span class="icon">🪣</span>Tidak ada barang di sini.<div class="hint">Coba kata kunci atau kategori lain.</div>';
    grid.appendChild(msg);
    return;
  }
  filtered.forEach(item => grid.appendChild(renderCard(item)));
}

/* Modal dengan foto carousel */
let modalFotoIdx = 0;
let modalFotos = [];

function openModal(item) {
  selectedItem = item;
  modalFotos   = getFotos(item);
  modalFotoIdx = 0;

  renderModalFoto();

  document.getElementById('modal-cat').textContent   = item.kategori || 'Lainnya';
  document.getElementById('modal-name').textContent  = item.nama;
  document.getElementById('modal-price').textContent = formatRupiah(item.harga || 0);

  const condLabel = item.kondisi || 'Bekas Normal';
  const condCls   = condClass(item.kondisi);
  document.getElementById('modal-meta').innerHTML =
    '<span>📍 ' + (item.lokasi || '—') + '</span>' +
    '<span class="card-cond ' + condCls + '">' + condLabel + '</span>';

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderModalFoto() {
  const wrap = document.getElementById('modal-foto-wrap');
  wrap.innerHTML = '';

  if (modalFotos.length === 0) {
    wrap.innerHTML = '<div style="width:100%;height:220px;display:flex;align-items:center;justify-content:center;font-size:72px;background:var(--bg2)">' + (selectedItem.emoji || '📦') + '</div>';
    return;
  }

  const track = document.createElement('div');
  track.className = 'modal-foto-track';
  track.id = 'modal-foto-track';

  modalFotos.forEach(function(url, i) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Foto ' + (i+1);
    img.onerror = function() {
      const fb = document.createElement('div');
      fb.className = 'emoji-fb';
      fb.textContent = selectedItem.emoji || '📦';
      img.replaceWith(fb);
    };
    track.appendChild(img);
  });

  wrap.appendChild(track);
  track.style.transform = 'translateX(0)';

  if (modalFotos.length > 1) {
    const prev = document.createElement('button');
    prev.className = 'modal-foto-nav modal-foto-prev';
    prev.innerHTML = '&#8592;';
    prev.onclick = function() { changeModalFoto(-1); };

    const next = document.createElement('button');
    next.className = 'modal-foto-nav modal-foto-next';
    next.innerHTML = '&#8594;';
    next.onclick = function() { changeModalFoto(1); };

    const dots = document.createElement('div');
    dots.className = 'modal-foto-dots';
    dots.id = 'modal-foto-dots';
    modalFotos.forEach(function(_, i) {
      const dot = document.createElement('span');
      if (i === 0) dot.className = 'active';
      dots.appendChild(dot);
    });

    wrap.appendChild(prev);
    wrap.appendChild(next);
    wrap.appendChild(dots);
  }
}

function changeModalFoto(dir) {
  modalFotoIdx = (modalFotoIdx + dir + modalFotos.length) % modalFotos.length;
  const track = document.getElementById('modal-foto-track');
  if (track) track.style.transform = 'translateX(-' + (modalFotoIdx * 100) + '%)';
  const dots = document.querySelectorAll('#modal-foto-dots span');
  dots.forEach(function(d, i) { d.className = i === modalFotoIdx ? 'active' : ''; });
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  selectedItem = null;
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

document.getElementById('modal-wa').addEventListener('click', function() {
  if (!selectedItem) return;
  const wa = (selectedItem.wa || '').replace(/\D/g, '');
  const text = encodeURIComponent('Halo, saya tertarik dengan *' + selectedItem.nama + '* seharga ' + formatRupiah(selectedItem.harga || 0) + ' yang ada di Pasar Bekas Solo. Apakah masih tersedia?');
  const url = wa ? 'https://wa.me/62' + wa.replace(/^0/, '') + '?text=' + text : 'https://wa.me/?text=' + text;
  window.open(url, '_blank');
});

document.getElementById('filters').addEventListener('click', function(e) {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  e.target.classList.add('active');
  activeFilter = e.target.dataset.cat;
  renderGrid();
});

let debounce;
document.getElementById('search').addEventListener('input', function(e) {
  clearTimeout(debounce);
  debounce = setTimeout(function() { searchQuery = e.target.value; renderGrid(); }, 200);
});

document.getElementById('btn-jual').addEventListener('click', function() {
  window.location.href = 'jual.html';
});

async function loadData() {
  const url = CONFIG.SHEET_CSV_URL;
  // Coba beberapa proxy secara berurutan
  const proxies = [
    u => 'https://corsproxy.io/?' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    u => 'https://thingproxy.freeboard.io/fetch/' + u,
  ];
  let allItems_loaded = false;
  for (const makeProxy of proxies) {
    try {
      const res = await fetch(makeProxy(url));
      const text = res.headers.get('content-type') && res.headers.get('content-type').includes('json')
        ? (await res.json()).contents
        : await res.text();
      const parsed = parseCSV(text || '');
      if (parsed.length >= 0) { allItems = parsed; allItems_loaded = true; break; }
    } catch(e) { continue; }
  }
  document.getElementById('loading-state') && document.getElementById('loading-state').remove();
  if (allItems_loaded) {
    renderGrid();
  } else {
    const grid = document.getElementById('grid');
    grid.innerHTML = '<div class="state-msg"><span class="icon">⚠️</span>Gagal memuat data.<div class="hint">Coba refresh halaman.</div></div>';
    document.getElementById('stats-text').textContent = '';
  }
}

loadData();
</script>
