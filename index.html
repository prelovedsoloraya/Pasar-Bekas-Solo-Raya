<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasar Bekas Solo Raya 🏮</title>
  <meta name="description" content="Pasar barang bekas lokal area Solo Raya — barang bagus, harga jujur.">
  <link rel="icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #534AB7; --purple-dark: #3C3489; --purple-pale: #EEEDFE; --purple-mid: #AFA9EC;
      --bg: #FAFAF8; --bg2: #F3F2EF; --border: #E4E2DC; --border2: #CECCBF;
      --text1: #1A1916; --text2: #5F5E5A; --text3: #9A9891;
      --radius-md: 10px; --radius-lg: 16px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text1); min-height: 100dvh; }
    a { color: inherit; text-decoration: none; }

    /* Nav */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      background: #fff; position: sticky; top: 0; z-index: 10;
      flex-wrap: wrap; gap: .75rem;
    }
    .nav-left h1 {
      font-family: 'Instrument Serif', serif; font-size: clamp(18px,3vw,24px);
      font-weight: 400; line-height: 1.1;
    }
    .nav-left .tagline { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .badge-lokasi {
      font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
      background: var(--purple-pale); color: var(--purple-dark); border: 1px solid var(--purple-mid);
    }
    .btn-jual {
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600;
      padding: 7px 16px; border-radius: 999px; background: var(--purple);
      color: var(--purple-pale); border: none; cursor: pointer; transition: background .15s;
    }
    .btn-jual:hover { background: var(--purple-dark); }

    /* Layout */
    .page { max-width: 960px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    /* Search */
    .search-wrap { position: relative; margin: 1.25rem 0 1rem; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text3); pointer-events: none; }
    .search-input {
      width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--border);
      border-radius: var(--radius-md); background: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px; color: var(--text1); outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--purple-mid); box-shadow: 0 0 0 3px rgba(83,74,183,.08); }
    .search-input::placeholder { color: var(--text3); }

    /* Filters */
    .filters {
      display: flex; gap: 7px; margin-bottom: 1.25rem;
      overflow-x: auto; padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
    }
    .filters:active { cursor: grabbing; }
    .filters::-webkit-scrollbar { height: 3px; }
    .filters::-webkit-scrollbar-track { background: transparent; }
    .filters::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 999px; }
    .filter-btn {
      font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: #fff; color: var(--text2);
      cursor: pointer; white-space: nowrap; transition: all .15s; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .filter-btn.active { background: var(--purple); color: var(--purple-pale); border-color: var(--purple); }
    .filter-btn:hover:not(.active) { background: var(--bg2); color: var(--text1); }

    /* Stats */
    .stats-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; font-size: 13px; color: var(--text2); }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; }

    /* Card */
    .card {
      border: 1px solid var(--border); border-radius: var(--radius-lg); background: #fff;
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      animation: fadeUp .35s ease both;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); border-color: var(--border2); }
    @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .card:nth-child(1){animation-delay:.00s} .card:nth-child(2){animation-delay:.04s}
    .card:nth-child(3){animation-delay:.08s} .card:nth-child(4){animation-delay:.12s}
    .card:nth-child(5){animation-delay:.16s} .card:nth-child(6){animation-delay:.20s}
    .card:nth-child(n+7){animation-delay:.24s}

    .card-img { width:100%; height:155px; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:54px; flex-shrink:0; user-select:none; position:relative; overflow:hidden; }
    .card-img img { width:100%; height:100%; object-fit:cover; display:block; }
    .foto-count { position:absolute; bottom:6px; right:7px; background:rgba(0,0,0,.5); color:#fff; font-size:10px; font-weight:600; padding:2px 7px; border-radius:999px; }

    .card-body { padding:10px 13px 13px; flex:1; display:flex; flex-direction:column; gap:3px; }
    .card-cat { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
    .card-name { font-size:14px; font-weight:500; color:var(--text1); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-price { font-family:'Plus Jakarta Sans',sans-serif;font-weight:800; font-size:18px; color:var(--purple); margin-top:5px; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
    .card-loc { font-size:11px; color:var(--text2); display:flex; align-items:center; gap:3px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Kondisi badges */
    .card-cond { font-size:10px; font-weight:600; padding:3px 9px; border-radius:999px; flex-shrink:0; }
    .cond-baru         { background:#D5F5EC; color:#0D6651; }
    .cond-like-new     { background:#DBEEFF; color:#1450A0; }
    .cond-bekas-mulus  { background:#EAF3DE; color:#3B6D11; }
    .cond-bekas-normal { background:#FAEEDA; color:#854F0B; }
    .cond-perlu-perbaikan { background:#F1EFE8; color:#5F5E5A; }
    .cond-default      { background:#F1EFE8; color:#5F5E5A; }

    /* States */
    .state-msg { grid-column:1/-1; text-align:center; padding:4rem 1rem; color:var(--text2); font-size:15px; }
    .state-msg .icon { font-size:40px; display:block; margin-bottom:12px; }
    .state-msg .hint { font-size:13px; color:var(--text3); margin-top:6px; }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--purple); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Load more */
    .load-more-wrap { grid-column:1/-1; display:flex; justify-content:center; padding:1rem 0 .5rem; }
    .btn-load-more {
      font-size:13px; font-weight:600; padding:10px 28px; border-radius:999px;
      border:1.5px solid var(--border2); background:#fff; color:var(--text1);
      cursor:pointer; transition:background .15s, border-color .15s; font-family:'Plus Jakarta Sans',sans-serif;
    }
    .btn-load-more:hover { background:var(--purple-pale); border-color:var(--purple-mid); color:var(--purple-dark); }

    /* Modal */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center; padding:1.5rem;
      z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:#fff; border-radius:var(--radius-lg); max-width:440px; width:100%;
      overflow:hidden; transform:scale(.94); transition:transform .2s;
      box-shadow:0 24px 60px rgba(0,0,0,.18); max-height:90vh; overflow-y:auto;
    }
    .modal-overlay.open .modal { transform:scale(1); }

    /* Carousel */
    .modal-carousel { position:relative; width:100%; height:320px; background:var(--bg2); overflow:hidden; }
    .carousel-track { display:flex; height:100%; transition:transform .3s ease; }
    .carousel-slide { flex:0 0 100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:72px; }
    .carousel-slide img { width:100%; height:100%; object-fit:contain; background:#F3F2EF; }
    .carousel-btn {
      position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.4);
      color:#fff; border:none; border-radius:50%; width:32px; height:32px; font-size:18px;
      cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2;
      transition:background .15s;
    }
    .carousel-btn:hover { background:rgba(0,0,0,.65); }
    .carousel-btn.prev { left:8px; } .carousel-btn.next { right:8px; }
    .carousel-dots { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:5px; z-index:2; }
    .carousel-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); cursor:pointer; transition:background .15s, transform .15s; }
    .carousel-dot.active { background:#fff; transform:scale(1.3); }

    .modal-body { padding:18px 20px 20px; }
    .modal-cat { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:5px; }
    .modal-name { font-family:'Plus Jakarta Sans',sans-serif;font-weight:800; font-size:22px; font-weight:400; line-height:1.2; }
    .modal-price { font-family:'Plus Jakarta Sans',sans-serif;font-weight:800; font-size:28px; color:var(--purple); margin:8px 0; }
    .modal-desc { font-size:13px; color:var(--text2); line-height:1.6; margin-bottom:12px; white-space:pre-wrap; }
    .modal-meta { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--text2); margin-bottom:16px; }
    .modal-meta span { display:flex; align-items:center; gap:4px; background:var(--bg2); padding:4px 10px; border-radius:999px; }
    .modal-actions { display:flex; gap:8px; }
    .modal-btn {
      flex:1; padding:11px; border-radius:var(--radius-md); border:1px solid var(--border);
      background:var(--bg); font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:600;
      cursor:pointer; transition:background .15s;
    }
    .modal-btn:hover { background:var(--bg2); }
    .modal-btn.primary { background:var(--purple); color:var(--purple-pale); border-color:var(--purple); }
    .modal-btn.primary:hover { background:var(--purple-dark); }

    /* FAB kiri — Tandai Terjual */
    .btn-terjual-float {
      position:fixed; bottom:24px; left:20px; z-index:99;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700;
      padding:13px 20px; border-radius:999px;
      background:#fff; color:#534AB7;
      border:1.5px solid #AFA9EC;
      cursor:pointer;
      box-shadow:0 4px 16px rgba(83,74,183,.15);
      opacity:1; transition:background .15s, transform .15s;
    }
    .btn-terjual-float:hover { background:#EEEDFE; }
    .btn-terjual-float:active { transform:scale(.96); }

    /* FAB kanan — Jual Barang */
    .btn-jual-float {
      position:fixed; bottom:24px; right:20px; z-index:99;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:700;
      padding:13px 22px; border-radius:999px; background:var(--purple);
      color:var(--purple-pale); border:none; cursor:pointer;
      box-shadow:0 6px 20px rgba(83,74,183,.35);
      opacity:0; pointer-events:none; transition:opacity .2s, transform .15s;
    }
    .btn-jual-float.visible { opacity:1; pointer-events:all; }
    .btn-jual-float:active { transform:scale(.96); }
    @media (max-width:600px) {
      .btn-jual-float { opacity:1 !important; pointer-events:all !important; }
    }




    /* Footer */
    .footer {
      margin-top:3rem; padding-top:1.25rem; border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:8px; font-size:12px; color:var(--text3);
    }

    @media (max-width:600px) {
      .nav { padding:1rem; }
      .btn-jual { display:none; }
      .grid { grid-template-columns:repeat(2,1fr); gap:12px; }
      .page { padding-bottom:7rem; }
    }
    @media (max-width:380px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>

</div>

      <div class="modal-cat"   id="modal-cat"></div>

        <button class="modal-btn primary" id="modal-wa">💬 Tanya via WA</button>
      </div>

</div>

<script>
const SUPABASE_URL = 'https://wlftqzxtfdzaywblpkzn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZnRxenh0ZmR6YXl3Ymxwa3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDg2NjksImV4cCI6MjA5NDI4NDY2OX0.Z6_brqQTgxE-jVNJP5CRkeeARccANQrHLEhl5G8pXaQ';

const EMOJI_MAP = {
  'hp & tablet':'📱','laptop & komputer':'💻','kamera':'📷','audio':'🎧',
  'elektronik lain':'🔌','perabot':'🛋️','dapur':'🍳','tanaman':'🌿',
  'fashion pria':'👔','fashion wanita':'👗','sepatu & tas':'👟','aksesoris':'💍',
  'buku':'📚','hobi & koleksi':'🎸','olahraga':'⚽','mainan':'🧸',
  'motor':'🏍️','mobil':'🚗','sparepart':'🔧','lainnya':'📦',
  'elektronik':'📱','fashion':'👗','hobi':'🎸','otomotif':'🏍️'
};

function getEmoji(item) { return EMOJI_MAP[(item.kategori||'').toLowerCase()] || item.emoji || '📦'; }

function formatRupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }

function condClass(k) {
  const s = (k||'').toLowerCase().replace(/\s+/g,' ').trim();
  if (s==='baru') return 'cond-baru';
  if (s==='like new') return 'cond-like-new';
  if (s==='bekas mulus') return 'cond-bekas-mulus';
  if (s==='bekas normal') return 'cond-bekas-normal';
  if (s==='perlu perbaikan') return 'cond-perlu-perbaikan';
  if (s.includes('baru')) return 'cond-baru';
  if (s.includes('mulus')) return 'cond-bekas-mulus';
  if (s.includes('like')) return 'cond-like-new';
  return 'cond-default';
}

function getFotos(item) {
  if (!item.foto) return [];
  return item.foto.split(/[|,]/).map(s=>s.trim()).filter(Boolean);
}

function isTerjual(item) { return (item.status||'').toLowerCase().trim()==='terjual'; }

let allItems=[], activeFilter='semua', searchQuery='', selectedItem=null;
let currentPage=1;
const PAGE_SIZE = window.innerWidth <= 600 ? 12 : 24;

function getFiltered() {
  return allItems.filter(item => {
    if (isTerjual(item)) return false;
    const catOk = activeFilter==='semua' || (item.kategori||'').toLowerCase()===activeFilter;
    const q = searchQuery.toLowerCase();
    const searchOk = !q ||
      (item.nama||'').toLowerCase().includes(q) ||
      (item.lokasi||'').toLowerCase().includes(q) ||
      (item.kategori||'').toLowerCase().includes(q) ||
      (item.deskripsi||'').toLowerCase().includes(q);
    return catOk && searchOk;
  });
}

function renderCard(item) {
  const card = document.createElement('div');
  const sold = isTerjual(item);
  card.className = 'card' + (sold?' sold':'');
  if (sold) card.style.pointerEvents='none';
  card.dataset.cat = (item.kategori||'').toLowerCase();

  const fotos = getFotos(item);
  const imgWrap = document.createElement('div');
  imgWrap.className = 'card-img';

  if (fotos.length > 0) {
    const img = document.createElement('img');
    img.src = fotos[0];
    img.alt = item.nama;
    img.loading = 'lazy';
    img.onerror = () => { imgWrap.innerHTML = getEmoji(item); };
    imgWrap.appendChild(img);
    if (fotos.length > 1) {
      const badge = document.createElement('span');
      badge.className = 'foto-count';
      badge.textContent = '📷 ' + fotos.length;
      imgWrap.appendChild(badge);
    }
  } else {
    imgWrap.textContent = getEmoji(item);
  }

  const condLabel = item.kondisi || 'Bekas';
  const condCls = condClass(item.kondisi);

  card.innerHTML = `
    <div class="card-body">
      <span class="card-cat">${item.kategori||'Lainnya'}</span>
      <p class="card-name">${item.nama}</p>
      <div class="card-price">${formatRupiah(item.harga||0)}</div>
      <div class="card-footer">
        <span class="card-loc">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          ${item.lokasi||'—'}
        </span>
        <span class="card-cond ${condCls}">${condLabel}</span>
      </div>
    </div>`;
  card.prepend(imgWrap);
  card.addEventListener('click', () => openModal(item));
  return card;
}

function renderGrid(resetPage=true) {
  if (resetPage) currentPage=1;
  const grid = document.getElementById('grid');
  const filtered = getFiltered();
  grid.innerHTML = '';

  document.getElementById('stats-text').innerHTML = filtered.length ? `${filtered.length} barang ditemukan` : '';

  if (!filtered.length) {
    const msg = document.createElement('div');
    msg.className = 'state-msg';
    msg.innerHTML = `<span class="icon">🪣</span>Tidak ada barang di sini.<div class="hint">Coba kata kunci atau kategori lain.</div>`;
    grid.appendChild(msg);
    return;
  }

  const pageItems = filtered.slice(0, currentPage*PAGE_SIZE);
  pageItems.forEach(item => grid.appendChild(renderCard(item)));

  if (pageItems.length < filtered.length) {
    const wrap = document.createElement('div');
    wrap.className = 'load-more-wrap';
    const btn = document.createElement('button');
    btn.className = 'btn-load-more';
    btn.textContent = `Muat ${Math.min(filtered.length-pageItems.length, PAGE_SIZE)} barang lagi`;
    btn.addEventListener('click', () => { currentPage++; renderGrid(false); btn.scrollIntoView({behavior:'smooth',block:'end'}); });
    wrap.appendChild(btn);
    grid.appendChild(wrap);
  }
}

function openModal(item) {
  selectedItem = item;
  const fotos = getFotos(item);
  const mediaEl = document.getElementById('modal-media');
  mediaEl.innerHTML = '';

  if (fotos.length === 0) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-carousel';
    wrap.style.display='flex'; wrap.style.alignItems='center'; wrap.style.justifyContent='center'; wrap.style.fontSize='72px';
    wrap.textContent = getEmoji(item);
    mediaEl.appendChild(wrap);
  } else if (fotos.length === 1) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-carousel';
    const img = document.createElement('img');
    img.src = fotos[0]; img.alt = item.nama;
    img.style.cssText='width:100%;height:100%;object-fit:cover;';
    img.onerror = () => { wrap.innerHTML=''; wrap.textContent=getEmoji(item); };
    wrap.appendChild(img);
    mediaEl.appendChild(wrap);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'modal-carousel';
    const track = document.createElement('div');
    track.className = 'carousel-track';
    let cur = 0;

    fotos.forEach((src,i) => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';
      const img = document.createElement('img');
      img.src = src; img.alt = item.nama+' foto '+(i+1);
      img.loading = i===0?'eager':'lazy';
      img.onerror = () => { slide.innerHTML=getEmoji(item); };
      slide.appendChild(img);
      track.appendChild(slide);
    });

    const btnPrev = document.createElement('button');
    btnPrev.className='carousel-btn prev'; btnPrev.innerHTML='‹';
    const btnNext = document.createElement('button');
    btnNext.className='carousel-btn next'; btnNext.innerHTML='›';
    const dotsWrap = document.createElement('div');
    dotsWrap.className='carousel-dots';
    const dots = fotos.map((_,i) => {
      const d=document.createElement('div');
      d.className='carousel-dot'+(i===0?' active':'');
      d.addEventListener('click',()=>goTo(i));
      dotsWrap.appendChild(d); return d;
    });

    function goTo(idx) {
      cur=(idx+fotos.length)%fotos.length;
      track.style.transform=`translateX(-${cur*100}%)`;
      dots.forEach((d,i)=>d.classList.toggle('active',i===cur));
    }
    btnPrev.addEventListener('click',e=>{e.stopPropagation();goTo(cur-1);});
    btnNext.addEventListener('click',e=>{e.stopPropagation();goTo(cur+1);});

    let touchX=0;
    wrap.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
    wrap.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX; if(Math.abs(dx)>40) goTo(dx<0?cur+1:cur-1);});

    wrap.appendChild(track); wrap.appendChild(btnPrev); wrap.appendChild(btnNext); wrap.appendChild(dotsWrap);
    mediaEl.appendChild(wrap);
  }

  document.getElementById('modal-cat').textContent = item.kategori||'Lainnya';
  document.getElementById('modal-name').textContent = item.nama;
  document.getElementById('modal-price').textContent = formatRupiah(item.harga||0);

  const descEl = document.getElementById('modal-desc');
  const desc = (item.deskripsi||'').trim();
  descEl.textContent = desc;
  descEl.style.display = desc ? 'block' : 'none';

  const condLabel = item.kondisi||'Bekas';
  const condCls = condClass(item.kondisi);
  document.getElementById('modal-meta').innerHTML =
    `<span>📍 ${item.lokasi||'—'}</span>
     <span class="card-cond ${condCls}" style="background:none;padding:0">${condLabel}</span>`;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
  selectedItem=null;
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target===document.getElementById('modal-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

document.getElementById('modal-wa').addEventListener('click', () => {
  if (!selectedItem) return;
  const text = encodeURIComponent(`Halo, saya tertarik dengan *${selectedItem.nama}* seharga ${formatRupiah(selectedItem.harga||0)} yang ada di Pasar Bekas Solo Raya. Apakah masih tersedia?`);
  const raw = (selectedItem.wa||'').replace(/\D/g,'');
  const nomor = raw.startsWith('0') ? '62'+raw.slice(1) : raw;
  window.open(nomor ? `https://wa.me/${nomor}?text=${text}` : `https://wa.me/?text=${text}`, '_blank');
});

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.cat;
  renderGrid();
});

let debounce;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { searchQuery=e.target.value; renderGrid(); }, 200);
});

// Drag to scroll filter
const filtersEl = document.getElementById('filters');
let isDown=false, startX, scrollLeft;
filtersEl.addEventListener('mousedown', e => { isDown=true; filtersEl.classList.add('active'); startX=e.pageX-filtersEl.offsetLeft; scrollLeft=filtersEl.scrollLeft; });
filtersEl.addEventListener('mouseleave', () => { isDown=false; });
filtersEl.addEventListener('mouseup', () => { isDown=false; });
filtersEl.addEventListener('mousemove', e => { if(!isDown) return; e.preventDefault(); const x=e.pageX-filtersEl.offsetLeft; filtersEl.scrollLeft=scrollLeft-(x-startX)*1.5; });

// FAB
const fab = document.getElementById('btn-jual-float');
fab.addEventListener('click', () => window.location.href='jual.html');

function updateFab() {
  fab.classList.toggle('visible', window.scrollY > 120 || allItems.length === 0);
}

// Langsung tampil saat halaman dibuka
fab.classList.add('visible');

window.addEventListener('scroll', updateFab, {passive:true});

// Load dari Supabase
async function loadData() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*&order=tgl.desc&limit=500`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    if (!res.ok) throw new Error('Gagal fetch');
    allItems = await res.json();
    document.getElementById('loading-state')?.remove();
    renderGrid();
    updateFab();
  } catch(err) {
    console.error(err);
    const grid = document.getElementById('grid');
    grid.innerHTML = `<div class="state-msg">
      <span class="icon">😮‍💨</span>Aduh, barangnya kabur semua.
      <div class="hint">Coba muat ulang halaman.</div>
    </div>`;
    document.getElementById('stats-text').textContent = '';
  }
}

loadData();
</script>
